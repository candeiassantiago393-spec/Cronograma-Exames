<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cronograma Exames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">CE</span>
        <div>
          <h1>Cronograma Exames</h1>
          <p>FQ A · Matemática A · Português · Out 2026 → Mai 2027</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn ghost" id="btn-today">Hoje</button>
        <div class="month-nav">
          <button type="button" class="icon-btn" id="btn-prev" aria-label="Mês anterior">‹</button>
          <h2 id="month-label">Outubro 2026</h2>
          <button type="button" class="icon-btn" id="btn-next" aria-label="Mês seguinte">›</button>
        </div>
        <button type="button" class="btn primary" id="btn-export">Exportar mês (PNG)</button>
      </div>
    </header>

    <div class="legend" id="legend"></div>

    <main class="layout">
      <section class="calendar-wrap" id="calendar-export-root">
        <div class="calendar-head" id="weekday-head"></div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </section>

      <aside class="side-panel" id="side-panel" aria-live="polite">
        <div class="side-empty" id="side-empty">
          <h3>Seleciona um dia</h3>
          <p>Clica num dia do calendário para ver as tarefas, marcar como feitas ou editar.</p>
        </div>
        <div class="side-content hidden" id="side-content">
          <div class="side-header">
            <div>
              <p class="side-eyebrow" id="side-week"></p>
              <h3 id="side-date"></h3>
            </div>
            <button type="button" class="icon-btn" id="btn-close-panel" aria-label="Fechar">×</button>
          </div>
          <div class="side-toolbar">
            <button type="button" class="btn ghost small" id="btn-add-task">+ Tarefa</button>
          </div>
          <ul class="task-list" id="task-list"></ul>
        </div>
      </aside>
    </main>
  </div>

  <dialog class="modal" id="task-modal">
    <form method="dialog" id="task-form">
      <h3 id="modal-title">Editar tarefa</h3>
      <label>Título
        <input type="text" name="title" required maxlength="200" />
      </label>
      <label>Detalhe
        <textarea name="detail" rows="4" maxlength="2000"></textarea>
      </label>
      <div class="form-row">
        <label>Disciplina
          <select name="discipline"></select>
        </label>
        <label>Tipo
          <select name="type"></select>
        </label>
      </div>
      <div class="form-row">
        <label>Data
          <input type="date" name="date" required />
        </label>
        <label>Duração
          <input type="text" name="duration" placeholder="ex: 1h30–2h" maxlength="40" />
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn danger ghost" id="btn-delete-task">Apagar</button>
        <div class="modal-actions-right">
          <button type="submit" value="cancel" class="btn ghost">Cancelar</button>
          <button type="submit" value="save" class="btn primary">Guardar</button>
        </div>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
